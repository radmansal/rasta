<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل من - رستا</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fc;
            --surface: rgba(255, 255, 255, 0.9);
            --surface-solid: #ffffff;
            --surface-soft: #f1f4fb;
            --text: #182033;
            --muted: #6b7488;
            --primary: #5b5ce2;
            --primary-soft: #e9e9ff;
            --success: #159c6a;
            --success-soft: #e0f8ef;
            --warning: #d28116;
            --warning-soft: #fff2d8;
            --danger: #dc3f55;
            --danger-dark: #bd3045;
            --border: rgba(24, 32, 51, 0.1);
            --shadow: 0 20px 60px rgba(42, 52, 91, 0.12);
            --shadow-soft: 0 8px 24px rgba(42, 52, 91, 0.08);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg: #0d1120;
                --surface: rgba(24, 30, 51, 0.92);
                --surface-solid: #181e33;
                --surface-soft: #222a43;
                --text: #f4f6ff;
                --muted: #aab2c5;
                --primary: #8b8df8;
                --primary-soft: rgba(139, 141, 248, 0.14);
                --success: #43d09d;
                --success-soft: rgba(67, 208, 157, 0.13);
                --warning: #f2b84b;
                --warning-soft: rgba(242, 184, 75, 0.14);
                --danger: #ff6679;
                --danger-dark: #e44f64;
                --border: rgba(255, 255, 255, 0.1);
                --shadow: 0 20px 60px rgba(0, 0, 0, 0.32);
                --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.2);
            }
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { min-height: 100%; scroll-behavior: smooth; }
        body {
            min-height: 100vh; margin: 0; padding: clamp(16px, 4vw, 52px);
            font-family: Vazirmatn, IRANSansX, Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.7; color: var(--text);
            background: radial-gradient(circle at 15% 0%, rgba(99, 102, 241, 0.19), transparent 30rem),
                        radial-gradient(circle at 95% 60%, rgba(14, 165, 233, 0.12), transparent 34rem),
                        var(--bg);
            -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
        }
        body::before {
            position: fixed; inset: 0; z-index: -1; pointer-events: none; content: ""; opacity: 0.32;
            background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 44px 44px; mask-image: linear-gradient(to bottom, black, transparent 75%);
        }
        .container {
            width: min(100%, 900px); margin-inline: auto; padding: clamp(22px, 5vw, 42px);
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
            box-shadow: var(--shadow); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        .header {
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
            margin-block-end: 22px; padding-block-end: 22px; border-block-end: 1px solid var(--border);
        }
        .header h2 {
            display: flex; align-items: center; gap: 14px; margin: 0;
            font-size: clamp(1.45rem, 4vw, 2.15rem); line-height: 1.3; letter-spacing: -0.025em;
        }
        .header h2::before {
            display: grid; width: 50px; height: 50px; flex: 0 0 auto; place-items: center; content: "ر";
            color: #fff; font-size: 1.25rem; font-weight: 850;
            background: linear-gradient(135deg, var(--primary), #7779f0); border-radius: 16px;
            box-shadow: 0 10px 20px rgba(91, 92, 226, 0.25);
        }
        .header button { width: auto; min-width: 96px; min-height: 44px; margin: 0; }
        .user-info { display: flex; flex-direction: column; gap: 5px; color: var(--muted); font-size: 0.94rem; }
        .user-info span { color: var(--text); font-weight: 750; }
        #contentArea { margin-block-start: 30px; }
        h3 {
            display: flex; align-items: center; gap: 10px; margin: 0 0 18px;
            font-size: 1.35rem; color: var(--text);
        }
        h3::before {
            width: 10px; height: 10px; content: ""; background: var(--primary);
            border-radius: 50%; box-shadow: 0 0 0 6px var(--primary-soft);
        }
        .question-list { display: grid; gap: 14px; margin-block-start: 0; }
        .question-item {
            position: relative; margin: 0; overflow: hidden; color: var(--text);
            background: var(--surface-solid); border: 1px solid var(--border);
            border-radius: var(--radius-md); box-shadow: var(--shadow-soft);
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }
        .question-item:hover {
            transform: translateY(-3px); border-color: color-mix(in srgb, var(--primary), transparent 55%);
            box-shadow: 0 14px 34px rgba(42, 52, 91, 0.12);
        }
        .question-header {
            padding: 20px; cursor: pointer; display: flex; align-items: center;
            justify-content: space-between; background: transparent; transition: background 0.2s;
        }
        .question-header:hover { background: var(--surface-soft); }
        .question-title-wrapper { display: flex; align-items: center; gap: 12px; flex-grow: 1; }
        .chevron-icon { width: 20px; height: 20px; fill: var(--muted); transition: transform 0.3s ease; }
        .question-item.active .chevron-icon { transform: rotate(180deg); }
        .question-title { margin: 0; font-size: 1.08rem; line-height: 1.7; font-weight: 700; }
        .status-badge {
            display: inline-flex; align-items: center; min-height: 28px; margin-inline-start: 6px;
            padding-inline: 10px; font-size: 0.76rem; font-weight: 800; border-radius: 999px;
        }
        .status-open { color: var(--warning); background: var(--warning-soft); }
        .status-answered { color: var(--success); background: var(--success-soft); }
        .question-details {
            display: none; padding: 0 20px 20px 20px; border-top: 1px solid var(--border);
            background: var(--surface-soft);
        }
        .question-item.active .question-details { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .detail-row { margin-bottom: 15px; margin-top: 15px; }
        .detail-label { font-weight: bold; color: var(--primary); display: block; margin-bottom: 6px; font-size: 0.9rem; }
        .file-links a {
            display: inline-flex; align-items: center; gap: 6px; margin-top: 5px; margin-left: 10px;
            color: var(--text); text-decoration: none; background: var(--surface-solid);
            padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
            font-size: 0.85rem; transition: all 0.2s;
        }
        .file-links a:hover { border-color: var(--primary); color: var(--primary); }
        audio { width: 100%; max-width: 300px; margin-top: 5px; border-radius: var(--radius-sm); }
        .answer-section {
            margin-top: 20px; padding: 15px; border: 1px dashed var(--primary);
            border-radius: var(--radius-sm); background: var(--surface-solid);
        }
        form { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
        input, textarea, select {
            padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 1rem; width: 100%; background: var(--surface-solid); color: var(--text); font-family: inherit;
        }
        input:focus, textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
        .btn-submit {
            background: var(--primary); color: white; border: none; padding: 12px 24px;
            border-radius: var(--radius-sm); cursor: pointer; font-weight: bold; transition: filter 0.2s;
        }
        .btn-submit:hover { filter: brightness(1.1); }
        .loading { text-align: center; padding: 20px; color: var(--muted); }
        
        /* استایل بخش تخصص */
        .specialty-alert {
            background: var(--warning-soft);
            border: 1px solid var(--warning);
            color: var(--warning);
            padding: 20px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .specialty-badge {
            background: var(--primary-soft);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .container { padding: 20px 14px; border-radius: 22px; }
            .header { align-items: flex-start; }
            .header h2::before { width: 44px; height: 44px; border-radius: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <div>
            <h2>پروفایل کاربری</h2>
            <div class="user-info" id="userInfo"></div>
        </div>
        <button onclick="logout()">خروج</button>
    </header>

    <div id="contentArea">
        <!-- بخش انتخاب تخصص (فقط برای معلم‌هایی که هنوز انتخاب نکردند) -->
        <div id="specialtySection" style="display: none;">
            <div class="specialty-alert">
                <h3 style="margin:0; font-size:1.1rem; color: var(--warning);">⚠️ تعیین حوزه تخصصی</h3>
                <p style="margin:0; font-size:0.9rem;">لطفاً حوزه تخصصی خود را انتخاب کنید. این انتخاب غیرقابل تغییر است.</p>
                <div style="display:flex; gap:10px; margin-top:10px; flex-wrap: wrap;">
                    <select id="specialtySelect" style="flex-grow:1;">
                        <option value="">انتخاب کنید...</option>
                        <option value="ریاضیات">ریاضیات</option>
                        <option value="فیزیک">فیزیک</option>
                        <option value="شیمی">شیمی</option>
                        <option value="زیست‌شناسی">زیست‌شناسی</option>
                        <option value="ادبیات">ادبیات فارسی</option>
                        <option value="زبان انگلیسی">زبان انگلیسی</option>
                        <option value="برنامه‌نویسی">برنامه‌نویسی و کامپیوتر</option>
                        <option value="تاریخ">تاریخ و علوم اجتماعی</option>
                    </select>
                    <button onclick="submitSpecialty()" class="btn-submit" style="width:auto; padding:0 20px;">ثبت تخصص</button>
                </div>
            </div>
        </div>

        <!-- نمایش تخصص انتخاب شده -->
        <div id="specialtyDisplay" style="display: none; margin-bottom: 20px;">
            <p style="color:var(--muted); font-size:0.9rem; margin-bottom: 5px;">حوزه تخصصی شما:</p>
            <span id="currentSpecialty" class="specialty-badge"></span>
        </div>

        <!-- فرم ثبت سوال (فقط برای دانشجو) -->
        <div id="studentSection" style="display: none;">
            <h3>❓ سوال خود را بپرسید</h3>
            <div class="question-item">
                <form id="questionForm" style="padding: 20px;">
                    <input type="text" id="qTitle" placeholder="عنوان سوال" required>
                    
                    <!-- ✅ انتخاب موضوع بر اساس تخصص معلمان -->
                    <label style="color: var(--muted); font-size: 0.9rem;">📚 موضوع سوال (اجباری):</label>
                    <select id="qTopic" required>
                        <option value="">در حال بارگذاری موضوعات...</option>
                    </select>

                    <textarea id="qDesc" rows="3" placeholder="توضیحات تکمیلی..."></textarea>
                    
                    <label style="color: var(--muted); font-size: 0.9rem;">📁 فایل پیوست (اختیاری):</label>
                    <input type="file" id="qFiles" multiple>
                    <button type="submit" class="btn-submit">ثبت سوال</button>
                </form>
            </div>
        </div>

        <h3 id="myQuestionsTitle">📋 سوالات من</h3>
        <div id="myQuestionsList" class="question-list">
            <div class="loading">در حال بارگذاری...</div>
        </div>

        <div id="teacherSection" style="display: none; margin-top: 40px;">
            <h3>👩‍🏫 پنل معلم - سوالات باز</h3>
            <div id="openQuestionsList" class="question-list">
                <div class="loading">در حال بارگذاری...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://fast-xau-mpanel2.runflare.cloud";
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user) {
        window.location.href = 'index.html';
    }

    document.getElementById('userInfo').innerHTML = `
        <p>نام: <span>${user.name}</span></p>
        <p>ایمیل: <span>${user.email}</span></p>
        <p>نقش: <span>${user.role === 'STUDENT' ? 'دانشجو' : 'معلم'}</span></p>
    `;

    // مدیریت نمایش بخش تخصص و سایر بخش‌ها
    if (user.role === 'TEACHER') {
        if (!user.specialty) {
            document.getElementById('specialtySection').style.display = 'block';
        } else {
            document.getElementById('specialtyDisplay').style.display = 'block';
            document.getElementById('currentSpecialty').innerText = user.specialty;
        }
        
        document.getElementById('teacherSection').style.display = 'block';
        document.getElementById('myQuestionsTitle').innerText = "📋 تاریخچه پاسخ‌های من";
        loadMyAnsweredQuestions();
        loadOpenQuestions();
    } else {
        document.getElementById('studentSection').style.display = 'block';
        document.getElementById('myQuestionsTitle').innerText = "📋 سوالات پرسیده شده توسط من";
        loadTopics(); // ✅ بارگذاری موضوعات برای دانشجو
        loadMyQuestions();
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'index.html';
    }

    async function submitSpecialty() {
        const select = document.getElementById('specialtySelect');
        const specialty = select.value;
        
        if (!specialty) {
            alert('لطفاً یک گزینه را انتخاب کنید.');
            return;
        }

        try {
            const response = await fetch(`${API_URL}/api/users/specialty`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ specialty })
            });

            if (response.ok) {
                const data = await response.json();
                alert('تخصص با موفقیت ثبت شد ✅');
                
                user.specialty = data.specialty;
                localStorage.setItem('user', JSON.stringify(user));
                
                window.location.reload();
            } else {
                const err = await response.json();
                alert(err.detail);
            }
        } catch (error) {
            console.error(error);
            alert('خطا در ارتباط با سرور');
        }
    }

    // ✅ تابع جدید برای دریافت لیست تخصص‌ها از سرور
    async function loadTopics() {
        try {
            const response = await fetch(`${API_URL}/api/specialties`);
            const data = await response.json();
            
            const select = document.getElementById('qTopic');
            select.innerHTML = '<option value="">انتخاب موضوع...</option>';
            
            if (data.specialties && data.specialties.length > 0) {
                data.specialties.forEach(topic => {
                    const option = document.createElement('option');
                    option.value = topic;
                    option.innerText = topic;
                    select.appendChild(option);
                });
            } else {
                const option = document.createElement('option');
                option.innerText = "هنوز موضوعی تعریف نشده است";
                option.disabled = true;
                select.appendChild(option);
            }
        } catch (error) {
            console.error(error);
            document.getElementById('qTopic').innerHTML = '<option>خطا در بارگذاری موضوعات</option>';
        }
    }

    document.getElementById('questionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('title', document.getElementById('qTitle').value);
        formData.append('description', document.getElementById('qDesc').value);
        formData.append('topic', document.getElementById('qTopic').value); // ✅ افزودن موضوع
        formData.append('student_id', user.id);
        
        const files = document.getElementById('qFiles').files;
        for (let i = 0; i < files.length; i++) {
            formData.append('files', files[i]);
        }

        try {
            const response = await fetch(`${API_URL}/api/questions`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            if (response.ok) {
                alert('سوال با موفقیت ثبت شد ✅');
                document.getElementById('questionForm').reset();
                loadMyQuestions();
            } else {
                const err = await response.json();
                alert('خطا: ' + err.detail);
            }
        } catch (error) {
            console.error(error);
            alert('خطا در ارتباط با سرور');
        }
    });

    async function loadMyQuestions() {
        try {
            const response = await fetch(`${API_URL}/api/questions/my`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            renderMyQuestions(data.questions);
        } catch (error) {
            console.error(error);
        }
    }

    async function loadMyAnsweredQuestions() {
        const container = document.getElementById('myQuestionsList');
        container.innerHTML = '<div class="loading">در حال بارگذاری تاریخچه پاسخ‌ها...</div>';
        
        try {
            const response = await fetch(`${API_URL}/api/questions/answered-by-me`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (response.ok) {
                const data = await response.json();
                renderTeacherHistory(data.questions);
            } else {
                container.innerHTML = '<p class="loading">خطا در دریافت اطلاعات.</p>';
            }
        } catch (error) {
            console.error(error);
            container.innerHTML = '<p class="loading">خطا در ارتباط با سرور.</p>';
        }
    }

    function renderMyQuestions(questions) {
        const container = document.getElementById('myQuestionsList');
        container.innerHTML = '';
        if (questions.length === 0) {
            container.innerHTML = '<p class="loading">هنوز سوالی ثبت نکرده‌اید.</p>';
            return;
        }

        questions.forEach(q => {
            const statusClass = q.status === 'OPEN' ? 'status-open' : 'status-answered';
            const statusText = q.status === 'OPEN' ? 'باز' : 'پاسخ داده شده';
            
            const item = document.createElement('div');
            item.className = 'question-item';
            
            const chevronSvg = `<svg class="chevron-icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>`;

            const header = document.createElement('div');
            header.className = 'question-header';
            header.innerHTML = `
                <div class="question-title-wrapper">
                    ${chevronSvg}
                    <h4 class="question-title">${q.title} <span style="font-size:0.8em; color:var(--primary); margin-right:8px;">(${q.topic || 'عمومی'})</span></h4>
                </div>
                <span class="status-badge ${statusClass}">${statusText}</span>
            `;
            
            const details = document.createElement('div');
            details.className = 'question-details';
            
            let filesHtml = '';
            if (q.file_urls && q.file_urls.length > 0) {
                filesHtml = `<div class="detail-row"><span class="detail-label">فایل‌های پیوست:</span><div class="file-links">`;
                q.file_urls.forEach(url => {
                    filesHtml += `<a href="${API_URL}${url}" target="_blank">📎 دانلود فایل</a>`;
                });
                filesHtml += `</div></div>`;
            }

            let voiceHtml = '';
            if (q.audio_url) {
                voiceHtml = `<div class="detail-row"><span class="detail-label">ویس شما:</span><br><audio controls src="${API_URL}${q.audio_url}"></audio></div>`;
            }

            let answerHtml = '';
            if (q.status === 'ANSWERED') {
                let teacherFiles = '';
                if (q.teacher_file_urls && q.teacher_file_urls.length > 0) {
                    teacherFiles = `<div class="detail-row"><span class="detail-label">فایل‌های پاسخ معلم:</span><div class="file-links">`;
                    q.teacher_file_urls.forEach(url => {
                        teacherFiles += `<a href="${API_URL}${url}" target="_blank">📎 دانلود فایل پاسخ</a>`;
                    });
                    teacherFiles += `</div></div>`;
                }
                
                let teacherVoice = '';
                if (q.teacher_audio_url) {
                    teacherVoice = `<div class="detail-row"><span class="detail-label">ویس پاسخ معلم:</span><br><audio controls src="${API_URL}${q.teacher_audio_url}"></audio></div>`;
                }

                answerHtml = `
                    <div class="answer-section">
                        <span class="detail-label">✅ پاسخ معلم (${q.answered_by}):</span>
                        <p>${q.answer || 'پاسخ متنی وجود ندارد.'}</p>
                        ${teacherVoice}
                        ${teacherFiles}
                    </div>
                `;
            }

            details.innerHTML = `
                <div class="detail-row">
                    <span class="detail-label">توضیحات:</span>
                    <p>${q.description || 'بدون توضیحات'}</p>
                </div>
                ${voiceHtml}
                ${filesHtml}
                ${answerHtml}
                <div class="detail-row" style="font-size:0.8rem; color:var(--muted);">
                    تاریخ ثبت: ${new Date(q.created_at).toLocaleDateString('fa-IR')}
                </div>
            `;

            header.addEventListener('click', () => {
                item.classList.toggle('active');
            });

            item.appendChild(header);
            item.appendChild(details);
            container.appendChild(item);
        });
    }

    function renderTeacherHistory(questions) {
        const container = document.getElementById('myQuestionsList');
        container.innerHTML = '';

        if (questions.length === 0) {
            container.innerHTML = '<p class="loading">هنوز به سوالی پاسخ نداده‌اید.</p>';
            return;
        }

        questions.forEach(q => {
            const item = document.createElement('div');
            item.className = 'question-item';
            
            const chevronSvg = `<svg class="chevron-icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>`;

            const header = document.createElement('div');
            header.className = 'question-header';
            header.innerHTML = `
                <div class="question-title-wrapper">
                    ${chevronSvg}
                    <h4 class="question-title">${q.title} <span style="font-size:0.8em; color:var(--primary); margin-right:8px;">(${q.topic || 'عمومی'})</span></h4>
                </div>
                <span class="status-badge status-answered">پاسخ داده شده</span>
            `;
            
            const details = document.createElement('div');
            details.className = 'question-details';
            
            let filesHtml = '';
            if (q.file_urls && q.file_urls.length > 0) {
                filesHtml = `<div class="detail-row"><span class="detail-label">فایل‌های دانشجو:</span><div class="file-links">`;
                q.file_urls.forEach(url => {
                    filesHtml += `<a href="${API_URL}${url}" target="_blank">📎 دانلود فایل</a>`;
                });
                filesHtml += `</div></div>`;
            }

            let voiceHtml = '';
            if (q.audio_url) {
                voiceHtml = `<div class="detail-row"><span class="detail-label">ویس دانشجو:</span><br><audio controls src="${API_URL}${q.audio_url}"></audio></div>`;
            }

            let teacherFiles = '';
            if (q.teacher_file_urls && q.teacher_file_urls.length > 0) {
                teacherFiles = `<div class="detail-row"><span class="detail-label">فایل‌های پاسخ شما:</span><div class="file-links">`;
                q.teacher_file_urls.forEach(url => {
                    teacherFiles += `<a href="${API_URL}${url}" target="_blank">📎 دانلود فایل پاسخ</a>`;
                });
                teacherFiles += `</div></div>`;
            }
            
            let teacherVoice = '';
            if (q.teacher_audio_url) {
                teacherVoice = `<div class="detail-row"><span class="detail-label">ویس پاسخ شما:</span><br><audio controls src="${API_URL}${q.teacher_audio_url}"></audio></div>`;
            }

            details.innerHTML = `
                <div class="detail-row">
                    <span class="detail-label">توضیحات دانشجو:</span>
                    <p>${q.description || 'بدون توضیحات'}</p>
                </div>
                ${voiceHtml}
                ${filesHtml}
                
                <div class="answer-section">
                    <span class="detail-label">✅ پاسخ ثبت شده توسط شما:</span>
                    <p>${q.answer || 'پاسخ متنی وجود ندارد.'}</p>
                    ${teacherVoice}
                    ${teacherFiles}
                </div>
                
                <div class="detail-row" style="font-size:0.8rem; color:var(--muted); margin-top:10px;">
                    تاریخ پاسخ: ${new Date(q.created_at).toLocaleDateString('fa-IR')}
                </div>
            `;

            header.addEventListener('click', () => {
                item.classList.toggle('active');
            });

            item.appendChild(header);
            item.appendChild(details);
            container.appendChild(item);
        });
    }

    async function loadOpenQuestions() {
        try {
            const response = await fetch(`${API_URL}/api/questions/open`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            renderOpenQuestions(data.questions);
        } catch (error) {
            console.error(error);
        }
    }

    function renderOpenQuestions(questions) {
        const container = document.getElementById('openQuestionsList');
        container.innerHTML = '';

        if (questions.length === 0) {
            container.innerHTML = '<p class="loading">سوال بازی در تخصص شما وجود ندارد.</p>';
            return;
        }

        questions.forEach(q => {
            const item = document.createElement('div');
            item.className = 'question-item';
            
            const chevronSvg = `<svg class="chevron-icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>`;

            const header = document.createElement('div');
            header.className = 'question-header';
            header.innerHTML = `
                <div class="question-title-wrapper">
                    ${chevronSvg}
                    <h4 class="question-title">${q.title} <span style="font-size:0.8em; color:var(--primary); margin-right:8px;">(${q.topic || 'عمومی'})</span></h4>
                </div>
                <span class="status-badge status-open">باز</span>
            `;
            
            const details = document.createElement('div');
            details.className = 'question-details';
            
            let filesHtml = '';
            if (q.file_urls && q.file_urls.length > 0) {
                filesHtml = `<div class="detail-row"><span class="detail-label">فایل‌های دانشجو:</span><div class="file-links">`;
                q.file_urls.forEach(url => {
                    filesHtml += `<a href="${API_URL}${url}" target="_blank">📎 دانلود فایل</a>`;
                });
                filesHtml += `</div></div>`;
            }

            let voiceHtml = '';
            if (q.audio_url) {
                voiceHtml = `<div class="detail-row"><span class="detail-label">ویس دانشجو:</span><br><audio controls src="${API_URL}${q.audio_url}"></audio></div>`;
            }

            details.innerHTML = `
                <div class="detail-row">
                    <span class="detail-label">توضیحات:</span>
                    <p>${q.description || 'بدون توضیحات'}</p>
                </div>
                ${voiceHtml}
                ${filesHtml}
                
                <hr style="margin: 15px 0; border: 0; border-top: 1px solid var(--border);">
                
                <h4 style="margin-bottom: 10px;">ثبت پاسخ</h4>
                <form onsubmit="submitAnswer(event, '${q.id}')">
                    <textarea id="ans-${q.id}" rows="3" placeholder="پاسخ متنی..." required></textarea>
                    <label style="color: var(--muted); font-size: 0.9rem;">ویس پاسخ (اختیاری):</label>
                    <input type="file" id="voice-${q.id}" accept="audio/*">
                    <label style="color: var(--muted); font-size: 0.9rem;">فایل پاسخ (اختیاری):</label>
                    <input type="file" id="files-${q.id}" multiple>
                    <button type="submit" class="btn-submit" style="margin-top:10px;">ارسال پاسخ</button>
                </form>
            `;

            header.addEventListener('click', () => {
                item.classList.toggle('active');
            });

            item.appendChild(header);
            item.appendChild(details);
            container.appendChild(item);
        });
    }

    async function submitAnswer(e, questionId) {
        e.preventDefault();
        
        const formData = new FormData();
        formData.append('answer_text', document.getElementById(`ans-${questionId}`).value);
        
        const voiceFile = document.getElementById(`voice-${questionId}`).files[0];
        if (voiceFile) formData.append('voice', voiceFile);
        
        const files = document.getElementById(`files-${questionId}`).files;
        for (let i = 0; i < files.length; i++) {
            formData.append('files', files[i]);
        }

        try {
            const response = await fetch(`${API_URL}/api/questions/${questionId}/submit-answer`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            if (response.ok) {
                alert('پاسخ با موفقیت ثبت شد ✅');
                loadOpenQuestions();
            } else {
                const err = await response.json();
                alert('خطا: ' + err.detail);
            }
        } catch (error) {
            console.error(error);
            alert('خطا در ارسال پاسخ');
        }
    }
</script>

</body>
</html>
